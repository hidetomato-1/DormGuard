<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f4">
  <title>DormGuard</title>
  <style>
    :root { color-scheme:light; --ink:#172a42; --muted:#718096; --line:#dfe8f1; --green:#245b94; --green-dark:#173a63; --mint:#e8f2fc; --paper:#fff; --canvas:#f5f9fd; }
    * { box-sizing:border-box }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; -webkit-font-smoothing:antialiased }
    button,input,select { font:inherit } button { cursor:pointer }
    .shell { width:min(100%,480px); min-height:100dvh; margin:0 auto; padding:0 20px 38px }
    header { padding:max(14px,env(safe-area-inset-top)) 0 22px; display:flex; align-items:center; justify-content:space-between }
    .brand { display:flex; gap:10px; align-items:center; font-weight:800; letter-spacing:-.5px; font-size:18px }
    .brand-mark { width:34px; height:34px; border-radius:12px; display:grid; place-items:center; background:var(--green); color:white }
    .brand-mark svg { width:20px; height:20px }
    .mode-switch { display:flex; padding:3px; border:1px solid var(--line); background:#fff; border-radius:999px; gap:2px }
    .mode-switch button { border:0; border-radius:999px; padding:8px 11px; background:transparent; color:var(--muted); font-size:11px; font-weight:700 }
    .mode-switch button.active { background:var(--green); color:#fff }
    .account-switch { border:1px solid var(--line); border-radius:999px; padding:8px 11px; background:#fff; color:var(--muted); font-size:11px; font-weight:750 }
    .intro { padding:8px 0 20px }
    .eyebrow { color:var(--green); font-weight:800; letter-spacing:1.2px; font-size:11px; margin:0 0 8px }
    h1 { font-size:26px; line-height:1.3; letter-spacing:-1px; margin:0 }
    .intro-copy { color:var(--muted); font-size:13px; margin:8px 0 0; line-height:1.65 }
    .privacy,.staff-note { padding:13px 14px; border-radius:14px; font-size:12px; line-height:1.6; margin-bottom:18px }
    .privacy { background:var(--mint); color:#294d70 }
    .staff-note { background:#eef1fa; color:#414b77 }
    .card { background:var(--paper); border:1px solid #edf0ed; border-radius:20px; padding:20px 17px; box-shadow:0 8px 24px rgba(25,50,37,.035) }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:0 0 18px }
    .section-title h2 { font-size:17px; margin:0; letter-spacing:-.5px }
    .required-note { color:#9aa49e; font-size:11px }
    .field { margin-bottom:16px }
    .field label,.field-label { display:block; font-weight:700; font-size:12px; margin-bottom:8px }
    .required { color:#9aa49e; font-weight:500; margin-left:4px }
    input,select { width:100%; min-height:48px; border:1px solid var(--line); border-radius:12px; padding:0 13px; color:var(--ink); background:#fff; outline:none; font-size:14px }
    textarea { width:100%; min-height:128px; border:1px solid var(--line); border-radius:12px; padding:12px 13px; color:var(--ink); background:#fff; outline:none; font:inherit; font-size:14px; line-height:1.6; resize:vertical }
    .field-hint { display:block; margin-top:7px; color:#69776e; font-size:11px; line-height:1.5 }
    input:focus,select:focus,textarea:focus { border-color:#76a9d9; box-shadow:0 0 0 3px rgba(36,91,148,.12) }
    input::placeholder { color:#b2bbb5 }
    input[type=date],input[type=time] { color:#37463e; color-scheme:light }
    .upload { width:100%; min-height:116px; border:1px dashed #cad6ce; border-radius:14px; background:#fbfcfb; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:#66766c; font-size:12px; overflow:hidden; position:relative; cursor:pointer }
    .upload:hover { border-color:var(--green); background:#f4f9fe }
    .upload svg { width:23px; height:23px; color:var(--green) }
    .upload strong { color:#34483b; font-size:12px }
    .upload small { font-size:10px; color:#9aa49e }
    .upload input { position:absolute; inset:0; opacity:0; cursor:pointer; min-height:100%; padding:0 }
    .upload.has-image { min-height:160px }
    .upload img { max-height:145px; max-width:100%; object-fit:contain; border-radius:10px }
    .file-name { max-width:90%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .submit,.primary { width:100%; min-height:51px; border:0; border-radius:14px; background:var(--green); color:#fff; font-size:15px; font-weight:800; box-shadow:0 5px 12px rgba(23,58,99,.18) }
    .submit:hover,.primary:hover { background:var(--green-dark) }
    .submit:disabled,.primary:disabled { opacity:.65; cursor:default }
    .list-section { margin-top:22px }
    .list-heading { display:flex; justify-content:space-between; align-items:center; margin:0 1px 12px }
    .list-heading h2 { font-size:16px; letter-spacing:-.4px; margin:0 }
    .count { font-size:11px; color:var(--muted); background:#e9eeea; padding:5px 9px; border-radius:999px }
    .case-list { display:grid; gap:9px }
    .case { display:flex; align-items:center; gap:12px; padding:13px; background:#fff; border:1px solid #edf0ed; border-radius:15px }
    .case { display:block; padding:14px }
    .case-head { display:flex; align-items:center; gap:10px }
    .case-icon { width:40px; height:40px; flex:none; display:grid; place-items:center; border-radius:13px; background:#edf4fb; color:var(--green); font-size:19px; overflow:hidden }
    .case-icon img { width:40px; height:40px; object-fit:cover }
    .case-info { min-width:0; flex:1 }
    .case-info strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px }
    .case-info span { display:block; color:var(--muted); font-size:11px; margin-top:4px }
    .status { flex:none; color:var(--green); background:var(--mint); font-size:10px; padding:5px 8px; border-radius:999px; font-weight:700 }
    .field-label { display:block; font-weight:700; font-size:12px; margin-bottom:8px }
    .staff-filters { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 13px }
    .filter-chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; color:#69776e; font-size:10px; font-weight:700 }
    .filter-chip.active { border-color:#b8d2eb; background:var(--mint); color:var(--green-dark) }
    .student-tabs { display:flex; gap:7px; margin:0 0 12px }
    .fact-request { width:100%; text-align:left; color:inherit; font:inherit }
    .fact-question { white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.7 }
    .right-note { padding:11px 12px; margin:12px 0; border-radius:11px; background:var(--mint); color:#294d70; font-size:12px; font-weight:750 }
    .staff-case { display:block; width:100%; text-align:left; color:inherit; font:inherit; cursor:pointer }
    .staff-case:hover { border-color:#b8d2eb; box-shadow:0 5px 15px #183b6010 }
    .staff-case-top { display:flex; align-items:center; gap:10px }
    .reporter-name { display:block; color:#647269; font-size:10px; margin-top:5px }
    .staff-case .case-info { flex:1 }
    .detail-back { border:0; background:transparent; color:var(--green); font-size:12px; font-weight:800; padding:0 0 14px }
    .detail-title { font-size:21px; margin:0 0 5px }
    .detail-subtitle { color:var(--muted); font-size:12px; margin:0 0 16px }
    .detail-card { padding:15px; border:1px solid var(--line); border-radius:15px; background:#fff; margin-bottom:14px }
    .detail-card h3 { font-size:13px; margin:0 0 12px }
    .detail-grid { display:grid; grid-template-columns:76px 1fr; gap:10px 8px; font-size:12px }
    .detail-grid dt { color:#87938b } .detail-grid dd { margin:0; font-weight:650; overflow-wrap:anywhere }
    .report-photo { display:block; max-width:100%; max-height:220px; border-radius:10px }
    .cctv-grid { display:grid; gap:10px }
    .cctv-frame { overflow:hidden; border:1px solid #dfe5e0; border-radius:13px; background:#35413b; margin:0 }
    .cctv-frame img { display:block; width:100%; aspect-ratio:16/8.4; object-fit:cover }
    .frame-caption { display:flex; justify-content:space-between; gap:8px; padding:8px 10px; color:#68776e; background:#fff; font-size:10px }
    .cctv-tag { color:#8a5b1b; font-weight:800 }
    .demo-disclaimer { padding:9px 11px; margin:0 0 11px; border-radius:10px; background:#f2f4f2; color:#68756d; font-size:10px }
    .status-button { width:100%; min-height:44px; border:0; border-radius:12px; background:var(--green); color:#fff; font-size:12px; font-weight:800 }
    .status-button:disabled { background:#e9eeea; color:#7b8780; cursor:default }
    .status-investigating { color:#4b6092; background:#edf1fb }
    .status-clarification { color:#a7681c; background:#fff5e7 }
    .status-done { color:#fff; background:#28649b }
    .status-cancelled { color:#7d8580; background:#edf0ee }
    .audit-list { display:grid; gap:9px; padding:0; margin:0; list-style:none }
    .audit-entry { padding:9px 10px; border-radius:10px; background:#f7f9f7; color:#526258; font-size:11px; line-height:1.5 }
    .audit-entry time { display:block; color:#89958d; font-size:9px; margin-top:3px }
    .empty { padding:20px; text-align:center; border:1px dashed #dce4de; border-radius:15px; color:#89958d; font-size:12px; line-height:1.6 }
    .student-timeline { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; margin:16px 0 12px }
    .timeline-step { color:#a3aca6; text-align:center; font-size:9px; line-height:1.3 }
    .timeline-step:before { content:""; display:block; width:12px; height:12px; margin:0 auto 6px; border:2px solid #d6ded8; border-radius:50%; background:#fff }
    .timeline-step.done { color:#52715e }.timeline-step.done:before { border-color:#7fb394; background:#7fb394 }
    .timeline-step.current { color:var(--green-dark); font-weight:800 }.timeline-step.current:before { border-color:var(--green); background:var(--green); box-shadow:inset 0 0 0 3px #fff }
    .student-alert { display:none; align-items:center; justify-content:space-between; gap:9px; margin:0 0 12px; padding:12px 13px; border:1px solid #f1dbb9; border-radius:13px; background:#fff8ed; color:#78501d; font-size:12px }
    .student-alert.show { display:flex }.student-alert button { border:0; border-radius:8px; padding:6px 9px; background:#f4e6ce; color:#704918; font-size:10px; font-weight:800 }
    .cancel-button,.restore-button { width:100%; min-height:39px; border:1px solid #e7caca; border-radius:11px; background:#fff; color:#a24949; font-size:11px; font-weight:800 }
    .restore-button { border-color:#b8d2eb; color:var(--green-dark) }
    .cancel-note { padding:9px; border-radius:10px; background:#f2f4f2; color:#768179; text-align:center; font-size:10px }
    .fairness { margin:0 0 14px; padding:12px 14px; border:1px solid #eadfc9; border-radius:13px; background:#fffdf8; color:#655334; font-size:12px; line-height:1.55 }
    .result-box { margin:12px 0; padding:11px; border-radius:11px; background:#f1f6f2; color:#405749; font-size:12px; line-height:1.6; white-space:pre-wrap }
    .view-hidden { display:none !important }
    .toast { position:fixed; z-index:5; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,16px); opacity:0; pointer-events:none; padding:13px 18px; border-radius:14px; color:#fff; background:#1c3126; box-shadow:0 8px 25px #14261c35; font-weight:700; font-size:13px; transition:opacity .2s,transform .2s; white-space:nowrap }
    .toast.show { opacity:1; transform:translate(-50%,0) }
    footer { text-align:center; font-size:10px; color:#a1aaa4; padding-top:18px }
    body:not(.authenticated) .shell { visibility:hidden }
    .login-gate { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px; background:rgba(18,35,27,.42); backdrop-filter:blur(5px) }
    .login-card { position:relative; width:min(100%,420px); padding:26px 22px; border:1px solid #edf0ed; border-radius:22px; background:#fff; box-shadow:0 24px 70px rgba(13,32,21,.2) }
    .login-card h2 { margin:0 0 8px; font-size:21px }
    .login-card p { margin:0 0 18px; color:var(--muted); font-size:13px; line-height:1.6 }
    .login-actions { display:grid; gap:10px }
    .login-section-title { margin:0 0 10px; color:var(--ink); font-size:16px; font-weight:850 }
    .login-privacy { padding:11px 12px; border:1px solid rgba(126,163,205,.3); border-radius:12px; background:rgba(235,244,255,.72); color:#415a78 !important; font-size:11px !important }
    .provider-button { width:100%; min-height:46px; border:1px solid rgba(128,157,192,.34); border-radius:12px; background:rgba(255,255,255,.84); color:#1d3859; font-size:13px; font-weight:800; box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(30,60,95,.06) }
    .provider-button.kakao { border-color:#eadf91; background:linear-gradient(135deg,#fffce2,#f7edaa); color:#352f16 }
    .profile-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 10px }
    .profile-grid input,.profile-grid select { min-width:0 }
    .login-card { max-height:calc(100dvh - 32px);overflow:auto }
    .video-ai-form { display:grid;gap:9px;padding-top:14px }
    .video-ai-form input[type=file] { width:100%;font-size:11px }
    .video-attachment-picker input[type=file] { width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;font-size:11px }
    .video-ai-summary { margin-top:12px;padding:11px 12px;border:1px solid rgba(126,163,205,.3);border-radius:12px;background:rgba(235,244,255,.72);color:#294d70;font-size:12px;line-height:1.6 }
    .video-ai-events { display:grid;gap:8px;padding:0;margin:10px 0;list-style:none }
    .video-ai-events li { display:grid;gap:4px;padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.72);font-size:11px;line-height:1.5 }
    .video-ai-events li strong { color:#19395f;font-size:12px }
    .video-ai-events li span,.video-ai-events li small { color:#61758e }
    .video-ai-warning { margin:10px 0 0;color:#85612d;font-size:10px;line-height:1.55 }
    .staff-overview { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 16px }
    .staff-stat { padding:13px 14px;border:1px solid rgba(255,255,255,.9);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(239,246,255,.82));box-shadow:0 8px 22px rgba(26,59,98,.065),inset 0 1px 0 #fff;backdrop-filter:blur(12px) }
    .staff-stat span { display:block;color:var(--muted);font-size:11px;font-weight:700 }
    .staff-stat strong { display:block;margin-top:4px;color:#18395f;font-size:23px;font-weight:900 }
    .staff-scope { grid-column:1/-1;padding:10px 13px;border:1px solid rgba(126,163,205,.3);border-radius:12px;background:rgba(235,244,255,.68);color:#415a78;font-size:11px;font-weight:750 }
    @media (min-width:700px) { .staff-overview { grid-template-columns:repeat(5,minmax(0,1fr)) } .staff-scope { grid-column:1/-1 } }
    .login-back { display:block; width:100%; margin-top:10px; padding:10px; border:0; background:transparent; color:var(--muted); font-size:12px; font-weight:700 }
    .login-error { min-height:18px; margin:8px 0 0 !important; color:#a24949 !important; font-size:11px !important }
    @media (min-width:520px) { body { padding:22px 0 } .shell { border-radius:27px; min-height:calc(100dvh - 44px); box-shadow:0 15px 55px rgba(25,50,37,.08) } }
    @media (min-width:900px), (min-width:700px) and (orientation:landscape) {
      body { padding:0 }
      .shell { width:min(100%,1360px); min-height:100dvh; padding:0 42px 30px; border-radius:0; box-shadow:none }
      header { padding:22px 0 18px }
      .intro { display:flex; align-items:baseline; gap:14px; padding:12px 0 22px }
      .intro .eyebrow { margin:0 }
      .intro h1 { flex:none; font-size:24px }
      .intro-copy { margin:0; max-width:680px }
      #student-view { display:grid; grid-template-columns:minmax(300px,.85fr) minmax(0,1.15fr); gap:0 28px; align-items:start }
      #privacy-note { grid-column:1 / -1; margin-bottom:16px }
      #student-view > .card { margin:0 }
      #student-view > .list-section { margin:0 }
      #student-fact-panel { max-width:820px }
      #fact-check-detail { margin-top:14px }
      #staff-view > .list-section { margin-top:0 }
      #staff-case-list { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start }
      #staff-detail-view:not(.view-hidden) { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 18px; align-items:start }
      #staff-detail-view > .detail-back,
      #staff-detail-view > .detail-title,
      #staff-detail-view > .detail-subtitle { grid-column:1 / -1 }
      #staff-detail-view > .detail-card:nth-of-type(1) { grid-column:1 }
      #staff-detail-view > .detail-card:nth-of-type(2) { grid-column:2 }
      #staff-detail-view > .detail-card:nth-of-type(3) { grid-column:1 }
      #staff-detail-view > .detail-card:nth-of-type(4) { grid-column:2 }
      #staff-detail-view .cctv-grid { grid-template-columns:1fr }
      footer { padding-top:24px }
    }
    /* DormGuard's visual identity: calm navy, glass-white surfaces, metallic highlights. */
    body {
      background:
        radial-gradient(ellipse at 8% 0%, rgba(151,198,239,.22), transparent 36%),
        radial-gradient(ellipse at 92% 15%, rgba(191,216,242,.3), transparent 32%),
        linear-gradient(155deg,#f8fbff 0%,#f0f5fb 55%,#f8faff 100%);
    }
    .brand {
      gap:12px;
      color:#122b4b;
      font-size:clamp(23px,6.2vw,32px);
      font-weight:900;
      letter-spacing:-1.35px;
      text-shadow:0 1px 0 #fff,0 5px 16px rgba(20,52,91,.1);
    }
    .brand-mark {
      width:clamp(38px,9vw,44px);
      height:clamp(38px,9vw,44px);
      border:1px solid rgba(255,255,255,.85);
      border-radius:15px;
      background:linear-gradient(145deg,#72a9e5 0%,#315f9d 48%,#17375f 100%);
      box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -2px 4px rgba(7,28,55,.3),0 5px 13px rgba(30,72,122,.22);
    }
    .brand-mark svg { width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18)) }
    h1 { font-size:clamp(22px,5.6vw,28px);font-weight:850;letter-spacing:-1.1px }
    .intro-copy { font-size:14px }
    .section-title h2,.list-heading h2 { font-size:18px;font-weight:800 }
    .field label,.field-label { font-size:13px;font-weight:750 }
    .case-info strong { font-size:14px;font-weight:800 }
    .mode-switch button,.filter-chip { font-size:11px;font-weight:750 }
    .submit,.primary { font-size:16px;font-weight:850 }
    .detail-title { font-size:23px;font-weight:850 }
    .detail-card h3 { font-size:14px;font-weight:800 }
    .login-card h2 { font-size:23px;font-weight:850 }
    .card,.detail-card,.login-card,.case {
      border-color:rgba(255,255,255,.9);
      background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(247,251,255,.82));
      box-shadow:0 12px 34px rgba(26,59,98,.075),inset 0 1px 0 rgba(255,255,255,.95);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      transform:perspective(1100px) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg)) translateY(var(--tilt-lift,0px));
      transform-style:preserve-3d;
      transition:transform .18s ease,box-shadow .22s ease,border-color .22s ease;
    }
    .login-card {
      border-color:rgba(255,255,255,.96);
      background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(238,246,255,.9));
      box-shadow:0 28px 78px rgba(13,39,74,.24),inset 0 1px 0 #fff;
    }
    .mode-switch { border-color:rgba(145,174,208,.5);background:rgba(255,255,255,.72);box-shadow:inset 0 1px 2px rgba(26,59,98,.07) }
    .mode-switch button.active,.submit,.primary,.status-button {
      background:linear-gradient(135deg,#477dbb 0%,#244f84 58%,#19395f 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 6px 16px rgba(25,62,107,.2);
    }
    .submit:hover,.primary:hover,.status-button:hover { background:linear-gradient(135deg,#5d91cc,#244f84 65%,#18375d) }
    .upload,.privacy,.staff-note,.fairness,.result-box { backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px) }
    @media (min-width:900px), (min-width:700px) and (orientation:landscape) {
      .intro h1 { font-size:29px }
    }
    @media (hover:hover) and (pointer:fine) {
      .card:hover,.detail-card:hover,.login-card:hover,.case:hover { --tilt-lift:-3px;box-shadow:0 18px 42px rgba(26,59,98,.13),inset 0 1px 0 #fff;border-color:rgba(132,174,220,.72) }
      .submit,.primary,.filter-chip,.mode-switch button,.staff-case,.cancel-button,.restore-button { transition:transform .18s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease }
      .submit:hover,.primary:hover,.filter-chip:hover,.mode-switch button:hover,.staff-case:hover,.cancel-button:hover,.restore-button:hover { transform:translateY(-2px) }
      .brand-mark { transition:transform .25s ease,filter .25s ease }
      .brand:hover .brand-mark { transform:rotate(-5deg) translateY(-2px);filter:brightness(1.08) }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important;transition-duration:.01ms !important;animation-duration:.01ms !important }
    }
    .tools { display:grid; gap:14px; margin:0 0 18px }
    @media (min-width:900px) { .tools { grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-items:start } }
    .tool-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin:0 0 12px }
    .tool-head h2 { font-size:17px; margin:0; letter-spacing:-.4px }

    async function extractVideoFrames(file) {
      const video = document.createElement('video'), url = URL.createObjectURL(file);

      document.querySelector('#login-title').textContent = '\uD654\uBA74 \uBAA8\uB4DC \uC120\uD0DD';
      document.querySelector('#login-description').textContent = '\uC0AC\uC6A9\uD560 \uBAA8\uB4DC\uB97C \uC120\uD0DD\uD574 \uC8FC\uC138\uC694.';
    }
    function setupText() {
      document.querySelector('#student-mode').textContent = COPY.student;
      document.querySelector('#staff-mode').textContent = COPY.staff;
      document.querySelector('#mode-switch').setAttribute('aria-label', COPY.student + ' / ' + COPY.staff);
      document.querySelector('#form-title').textContent = COPY.form;
      document.querySelector('#required-note').textContent = COPY.required;
      document.querySelector('#reporter-label').textContent = COPY.name + ' *';
      document.querySelector('#date-label').textContent = COPY.date + ' *';
      document.querySelector('#time-label').textContent = COPY.time + ' *';
      document.querySelector('#place-label').textContent = COPY.place + ' *';
      document.querySelector('#item-label').textContent = COPY.item + ' *';
      document.querySelector('#photo-label').textContent = COPY.photo;
      document.querySelector('#item').placeholder = COPY.itemHint;
      document.querySelector('#submit-button').textContent = COPY.submit;
      document.querySelector('#privacy-note').textContent = COPY.privacy;
      document.querySelector('#student-list-title').textContent = COPY.myReports;
      document.querySelector('#archive-title').textContent = COPY.archive;
      document.querySelector('#staff-list-title').textContent = COPY.list;
      document.querySelector('#staff-note').textContent = COPY.staffNote;
      document.querySelector('#fairness-note').textContent = COPY.fairness;
      document.querySelector('#footer-note').textContent = COPY.staffNote;
      document.querySelector('#place').innerHTML = '<option value=\"\" disabled selected>' + COPY.choose + '</option>' + PLACES.map(function(place) { return '<option value=\"' + esc(place) + '\">' + esc(place) + '</option>'; }).join('');
      resetUpload();
      resetVideoAttachment();
    }
    function resetUpload() {
      uploadBox.classList.remove('has-image'); photoInput.value = ''; imageData = '';
      uploadContent.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" aria-hidden=\"true\"><path d=\"M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v5h14v-5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><strong>사진을 첨부해 주세요</strong><small>JPG, PNG, WEBP - 자동으로 작게 줄여서 올라가요</small>';
    }
    function resetVideoAttachment() {
      if (reportVideoPreviewUrl) URL.revokeObjectURL(reportVideoPreviewUrl);
      reportVideoPreviewUrl = '';
      reportVideoInput.value = '';
      document.querySelector('#report-video-preview').replaceChildren();
    }
    function compressImage(file) {
      return new Promise(function(resolve, reject) {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = function() {
          const scale = Math.min(1, 900 / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          let quality = 0.72, data = canvas.toDataURL('image/jpeg', quality);
          while (data.length > 600000 && quality > 0.3) { quality -= 0.1; data = canvas.toDataURL('image/jpeg', quality); }
          resolve(data);
        };
        img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요.')); };
        img.src = url;
      });
    }
    photoInput.addEventListener('change', async function() {
      const file = photoInput.files && photoInput.files[0]; if (!file) return;
      if (!['image/jpeg','image/png','image/webp'].includes(file.type)) { resetUpload(); toast('이미지 파일만 첨부할 수 있어요.'); return; }
      if (file.size > 10*1024*1024) { resetUpload(); toast('사진은 10MB 이하로 첨부해 주세요.'); return; }
      try {
        imageData = await compressImage(file);
        uploadBox.classList.add('has-image');
        uploadContent.innerHTML = '<img src=\"' + imageData + '\" alt=\"첨부 사진\"><span class=\"file-name\">' + esc(file.name) + '</span>';
      } catch (error) { resetUpload(); toast(error.message); }
    });
    reportVideoInput.addEventListener('change', async function() {
      const file = reportVideoInput.files && reportVideoInput.files[0];
      const preview = document.querySelector('#report-video-preview'); preview.replaceChildren();
      if (reportVideoPreviewUrl) URL.revokeObjectURL(reportVideoPreviewUrl);
      reportVideoPreviewUrl = '';
      if (!file) return;
      if (!(file.type === 'video/mp4' || /\.mp4$/i.test(file.name)) || file.size > 12 * 1024 * 1024) {
        reportVideoInput.value = ''; toast('영상은 MP4, 12MB 이하 파일만 첨부할 수 있어요.'); return;
      }
      try {
        const duration = await checkVideoDuration(file);
        if (!Number.isFinite(duration) || duration > 30) throw new Error('영상은 30초 이하로 선택해 주세요.');
        reportVideoPreviewUrl = URL.createObjectURL(file);
        const player = document.createElement('video'); player.controls = true; player.preload = 'metadata'; player.playsInline = true; player.src = reportVideoPreviewUrl;
        player.style.cssText = 'display:block;width:100%;max-height:220px;margin-top:8px;border-radius:12px;background:#101820';
        preview.appendChild(player);
      } catch (error) { reportVideoInput.value = ''; preview.replaceChildren(); toast(error.message || '영상을 읽지 못했어요.'); }
    });
    document.querySelector('#student-mode').addEventListener('click', function() { if (studentProfile()) completeLogin('student'); else showStudentLogin(); });
    document.querySelector('#staff-mode').addEventListener('click', function() {
      if (sessionStore.getItem(LOGIN_ROLE_KEY) === 'staff' && staffSchool()) setMode('staff');
      else showStaffCodeGate();
    });
    document.querySelector('#login-student').addEventListener('click', showStudentLogin);
    document.querySelector('#login-staff').addEventListener('click', showStaffCodeGate);
    document.querySelector('#login-back').addEventListener('click', showModeChoices);
    document.querySelector('#account-switch').addEventListener('click', function() {
      sessionStore.removeItem(STUDENT_PROFILE_KEY);
      sessionStore.removeItem(STAFF_SCHOOL_KEY);
      sessionStore.removeItem(STAFF_CODE_KEY);
      sessionStore.removeItem(LOGIN_ROLE_KEY);
      stopSync(); reportCache = []; ownerId = ''; STUDENTS = []; notices = []; renderNotices();
      auth.signOut().catch(function() {});
      document.body.classList.remove('authenticated');
      document.querySelector('#account-switch').classList.add('view-hidden');
      document.querySelector('#login-gate').classList.remove('view-hidden');
      showModeChoices();
    });
    const studentLoginPanel = document.querySelector('#student-login-panel');
    studentLoginPanel.addEventListener('click', function(event) {
      const back = event.target.closest('[data-login-back]');
      if (back) showModeChoices();
    });
    studentLoginPanel.addEventListener('submit', async function(event) {
      if (event.target.id !== 'student-profile-form') return;
      event.preventDefault();
      if (!event.target.reportValidity()) return;
      const profile = {
        name:document.querySelector('#student-name').value.trim(),
        school:document.querySelector('#student-school').value.trim(),
        grade:document.querySelector('#student-grade').value,
        classNumber:document.querySelector('#student-class').value,
        studentNumber:document.querySelector('#student-number').value,
        building:document.querySelector('#student-building').value,
        room:document.querySelector('#student-room').value.trim()
      };
      const button = event.target.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        if (!auth.currentUser || !auth.currentUser.isAnonymous) await auth.signInAnonymously();
        ownerId = auth.currentUser.uid;
        profile.id = ownerId;
        await db.collection('students').doc(ownerId).set(Object.assign({}, profile, { updatedAt: new Date().toISOString() }));
        sessionStore.setItem(STUDENT_PROFILE_KEY, JSON.stringify(profile));
        document.querySelector('#reporter').value = profile.name;
        completeLogin('student');
      } catch (error) {
        console.error(error);
        toast('정보를 저장하지 못했어요. 인터넷 연결을 확인해 주세요.');
      } finally { button.disabled = false; }
    });
    document.querySelector('#staff-code-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const errorBox = document.querySelector('#staff-code-error');
      errorBox.textContent = '';
      try {
        const result = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        const email = result.user && result.user.email;
        const staffDoc = email ? await db.collection('staff').doc(email).get() : null;
        if (!staffDoc || !staffDoc.exists) {
          await auth.signOut();
          errorBox.textContent = '사감 명단에 없는 계정이에요. 등록된 Google 계정으로 다시 로그인해 주세요.';
          return;
        }
        sessionStore.setItem(STAFF_SCHOOL_KEY, staffDoc.data().school || DEMO_SCHOOL);
        completeLogin('staff');
      } catch (error) {
        console.error(error);
        errorBox.textContent = error && error.code === 'auth/popup-closed-by-user' ? '로그인 창이 닫혔어요. 다시 시도해 주세요.' : '로그인하지 못했어요. 잠시 후 다시 시도해 주세요.';
      }
    });
    document.querySelector('#student-reports-tab').addEventListener('click', function() { setStudentTab('reports'); });
    document.querySelector('#student-fact-tab').addEventListener('click', function() { setStudentTab('fact'); });
    form.addEventListener('submit', async function(event) {
      event.preventDefault(); if (!form.reportValidity()) return;
      const profile = studentProfile();
      if (!profile || !profile.school || !ownerId) { showStudentLogin(); return; }
      const submitButton = document.querySelector('#submit-button');
      submitButton.disabled = true;
      const now = new Date().toISOString();
      const report = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'report-' + Date.now(),
        reporterId: ownerId, reporterName: document.querySelector('#reporter').value.trim(),
        school: profile.school,
        date: dateInput.value, time: timeInput.value, place: document.querySelector('#place').value,
        item: document.querySelector('#item').value.trim(), photo: imageData || '',
        status: STEPS[0], createdAt: now, updatedAt: now,
        auditTrail: [{ action: '학생이 신고를 접수', at: now }]
      };
      try {
        await db.collection('reports').doc(report.id).set(report);
        const seen = mapValue(STUDENT_SEEN_KEY); seen[report.id] = STEPS[0]; localStore.setItem(STUDENT_SEEN_KEY, JSON.stringify(seen));
        form.reset(); resetUpload(); setDefaults();
        document.querySelector('#reporter').value = profile.name;
        toast('신고가 접수됐어요.');
      } catch (error) {
        console.error(error);
        toast('신고를 저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
      } finally { submitButton.disabled = false; }
    });
    window.addEventListener('storage', function(event) {
      if ([KEY,STUDENT_SEEN_KEY,STAFF_SEEN_KEY].includes(event.key)) {
        if (mode === 'student') renderStudent();
        else {
          if (openId) { const report = staffReports().find(function(item) { return item.id === openId; }); if (report) renderDetail(report); else { openId = ''; renderStaffList(); } }
          else renderStaffList();
          showStaffCancelAlert();
          showStaffAnswerToast();
        }
      }
    });
    document.querySelector('#pattern-range').addEventListener('click', function(event) {
      const button = event.target.closest('[data-range]');
      if (!button) return;
      patternRange = button.dataset.range;
      document.querySelectorAll('#pattern-range [data-range]').forEach(function(chip) { chip.classList.toggle('active', chip === button); });
      renderPatterns();
    });
    document.querySelector('#pattern-demo-toggle').addEventListener('change', renderPatterns);
    document.querySelector('#notice-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const text = document.querySelector('#notice-text').value.trim();
      if (!text) return;
      const button = event.target.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        await db.collection('notices').add({ school: staffSchool(), text: text, createdAt: new Date().toISOString(), createdBy: (auth.currentUser && auth.currentUser.email) || '', active: true });
        document.querySelector('#notice-text').value = '';
        toast('공지를 올렸어요');
      } catch (error) { console.error(error); toast('공지를 올리지 못했어요. 인터넷 연결을 확인해 주세요.'); }
      finally { button.disabled = false; }
    });
    document.querySelector('#notice-list').addEventListener('click', async function(event) {
      const button = event.target.closest('[data-notice-off]');
      if (!button) return;
      try { await db.collection('notices').doc(button.dataset.noticeOff).update({ active: false }); toast('공지를 내렸어요'); }
      catch (error) { console.error(error); toast('공지를 내리지 못했어요.'); }
    });
    setDefaults();
    setupText();
    setStudentTab(studentTab);
    showModeChoices();
    const stopBootWatch = auth.onAuthStateChanged(async function(user) {
      stopBootWatch();
      try {
        if (user && user.isAnonymous) {
          const snap = await db.collection('students').doc(user.uid).get();
          if (snap.exists) {
            ownerId = user.uid;
            sessionStore.setItem(STUDENT_PROFILE_KEY, JSON.stringify(Object.assign({}, snap.data(), { id: user.uid })));
            document.querySelector('#reporter').value = snap.data().name || '';
            completeLogin('student');
            return;
          }
        } else if (user && user.email) {
          const staffDoc = await db.collection('staff').doc(user.email).get();
          if (staffDoc.exists) {
            sessionStore.setItem(STAFF_SCHOOL_KEY, staffDoc.data().school || DEMO_SCHOOL);
            completeLogin('staff');
            return;
          }
        }
      } catch (error) { console.error(error); }
    });
    document.addEventListener('pointermove', function(event) {
      if (event.pointerType === 'touch') return;
      const surface = event.target.closest('.card,.detail-card,.login-card,.case');
      if (!surface) return;
      const rect = surface.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width - .5;
      const y = (event.clientY - rect.top) / rect.height - .5;
      surface.style.setProperty('--tilt-x', (-y * 2.2).toFixed(2) + 'deg');
      surface.style.setProperty('--tilt-y', (x * 2.8).toFixed(2) + 'deg');
    });
    document.addEventListener('pointerout', function(event) {
      const surface = event.target.closest('.card,.detail-card,.login-card,.case');
      if (surface && !surface.contains(event.relatedTarget)) {
        surface.style.removeProperty('--tilt-x');
        surface.style.removeProperty('--tilt-y');
      }
    });
  </script>
